<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reels Audit — Анализ рилсов</title>
<style>
:root {
  --bg: #0d1117;
  --card: #161b22;
  --border: #30363d;
  --text: #c9d1d9;
  --muted: #7d8590;
  --accent: #f0883e;
  --green: #3fb950;
  --red: #f85149;
  --blue: #388bfd;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  line-height: 1.6;
  padding: 24px;
  min-height: 100vh;
}
.container { max-width: 800px; margin: 0 auto; }
h1 { font-size: 28px; margin-bottom: 8px; color: var(--accent); }
.subtitle { color: var(--muted); margin-bottom: 32px; }
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  margin-bottom: 20px;
}
input[type="url"] {
  width: 100%;
  padding: 14px 16px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 16px;
  margin-bottom: 12px;
}
input[type="url"]:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(240,136,62,0.15);
}
.btn {
  background: var(--accent);
  color: #000;
  border: none;
  padding: 14px 28px;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  width: 100%;
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(240,136,62,0.3); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.loading { position: relative; color: transparent; }
.btn.loading::after {
  content: '';
  position: absolute;
  width: 20px;
  height: 20px;
  top: 50%;
  left: 50%;
  margin-left: -10px;
  margin-top: -10px;
  border: 2px solid #000;
  border-top-color: transparent;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.result {
  display: none;
  animation: fadeIn 0.3s ease;
}
.result.show { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.metric-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin: 20px 0;
}
.metric {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 20px;
  text-align: center;
}
.metric .value {
  font-size: 36px;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 4px;
}
.metric .label {
  font-size: 13px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.hook-box {
  background: var(--bg);
  border-left: 3px solid var(--accent);
  padding: 16px;
  border-radius: 0 8px 8px 0;
  margin-top: 16px;
  font-style: italic;
  color: var(--text);
}
.error {
  background: rgba(248,81,73,0.1);
  border: 1px solid var(--red);
  color: var(--red);
  padding: 16px;
  border-radius: 8px;
  margin-top: 16px;
}
.loading-text {
  text-align: center;
  color: var(--muted);
  padding: 40px;
}
.example {
  margin-top: 16px;
  padding: 12px;
  background: var(--bg);
  border-radius: 6px;
  font-size: 13px;
  color: var(--muted);
}
.example a {
  color: var(--blue);
  cursor: pointer;
  text-decoration: underline;
}
</style>
</head>
<body>
<div class="container">
  <h1>🎬 Reels Audit</h1>
  <p class="subtitle">Вставь ссылку на Instagram Reel — получи лайки, комменты, просмотры</p>

  <div class="card">
    <input type="url" id="reelUrl" placeholder="https://www.instagram.com/reel/ABC123DEF/" />
    <button class="btn" id="analyzeBtn" onclick="analyze()">Анализировать</button>
    <div class="example">
      Попробуй: <a onclick="document.getElementById('reelUrl').value='https://www.instagram.com/reel/C0xample123/'; analyze()">пример ссылки</a>
    </div>
  </div>

  <div class="result" id="result">
    <div class="card">
      <h2 style="color: var(--accent); margin-bottom: 16px;">📊 Результаты</h2>
      <div class="metric-grid">
        <div class="metric">
          <div class="value" id="likes">—</div>
          <div class="label">❤️ Лайки</div>
        </div>
        <div class="metric">
          <div class="value" id="comments">—</div>
          <div class="label">💬 Комменты</div>
        </div>
        <div class="metric">
          <div class="value" id="views">—</div>
          <div class="label">👁 Просмотры</div>
        </div>
      </div>
      <div class="hook-box" id="hookBox" style="display:none;">
        <strong>Хук:</strong> <span id="hookText"></span>
      </div>
      <div style="margin-top: 16px; color: var(--muted); font-size: 14px;" id="dateText"></div>
    </div>
  </div>

  <div class="loading-text" id="loading" style="display:none;">
    ⏳ Анализирую рилс...
  </div>

  <div class="error" id="error" style="display:none;"></div>
</div>

<script>
// URL Cloudflare Worker
const WORKER_URL = 'https://reels-audit-worker.iralinskiy777.workers.dev';

async function analyze() {
  const url = document.getElementById('reelUrl').value.trim();
  const btn = document.getElementById('analyzeBtn');
  const result = document.getElementById('result');
  const loading = document.getElementById('loading');
  const error = document.getElementById('error');

  if (!url) {
    showError('Вставь ссылку на Instagram Reel');
    return;
  }

  btn.disabled = true;
  btn.classList.add('loading');
  result.classList.remove('show');
  error.style.display = 'none';
  loading.style.display = 'block';

  try {
    const resp = await fetch(`${WORKER_URL}?url=${encodeURIComponent(url)}`);
    const data = await resp.json();

    if (data.error) {
      showError(data.error);
      return;
    }

    document.getElementById('likes').textContent = data.likes?.toLocaleString('ru') || '—';
    document.getElementById('comments').textContent = data.comments?.toLocaleString('ru') || '—';
    document.getElementById('views').textContent = data.views?.toLocaleString('ru') || '—';
    document.getElementById('dateText').textContent = data.date ? `📅 ${data.date}` : '';

    if (data.hook) {
      document.getElementById('hookBox').style.display = 'block';
      document.getElementById('hookText').textContent = data.hook;
    } else {
      document.getElementById('hookBox').style.display = 'none';
    }

    result.classList.add('show');
  } catch (e) {
    showError('Ошибка: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.classList.remove('loading');
    loading.style.display = 'none';
  }
}

function showError(msg) {
  const error = document.getElementById('error');
  error.textContent = '❌ ' + msg;
  error.style.display = 'block';
}

// Enter key
document.getElementById('reelUrl').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') analyze();
});
</script>
</body>
</html>
