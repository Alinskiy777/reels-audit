<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reels Audit — Анализ рилсов</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--line:#232a33;--fg:#e6edf3;
  --dim:#7d8590;--grn:#2ea043;--blu:#388bfd;--org:#f0883e;--pur:#a371f7;--red:#f85149}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:14px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;padding:0 20px 90px}
.container{max-width:1100px;margin:0 auto}
h1{margin:32px 0 0;font-size:clamp(24px,4vw,34px);font-weight:700;letter-spacing:-.6px;
  line-height:1.12;color:var(--fg)}
.sub,.subtitle{color:var(--dim);font-size:13.5px;line-height:1.5;margin:12px 0 0;max-width:60ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:11px;
  padding:16px 18px;margin:16px 0;transition:background .15s,border-color .15s}
.card:hover{background:#11161d;border-color:#30363d}
input[type="url"]{width:100%;height:40px;background:var(--bg);border:1px solid var(--line);
  border-radius:10px;color:var(--fg);font-size:13.5px;padding:0 12px;outline:none;
  font-family:inherit;transition:border-color .12s}
input[type="url"]:focus{border-color:var(--blu);box-shadow:0 0 0 3px rgba(56,139,253,.16)}
input[type="url"]::placeholder{color:#5c6570}
.btn{background:var(--bg);border:1px solid var(--line);color:var(--fg);
  height:40px;padding:0 18px;border-radius:10px;font-size:13.5px;font-weight:600;
  cursor:pointer;font-family:inherit;transition:background .15s,border-color .15s;width:100%}
.btn:hover{background:#11161d;border-color:#30363d}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.loading{position:relative;color:transparent}
.btn.loading::after{content:'';position:absolute;width:20px;height:20px;top:50%;left:50%;
  margin-left:-10px;margin-top:-10px;border:2px solid var(--fg);border-top-color:transparent;
  border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.result{display:none;animation:fadeIn .35s ease}
.result.show{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin:16px 0}
.metric{background:var(--card);border:1px solid var(--line);border-radius:11px;
  padding:16px;text-align:left;position:relative;overflow:hidden;min-height:104px;
  display:flex;flex-direction:column;justify-content:flex-start;transition:background .15s}
.metric:hover{background:#11161d}
.metric::after{content:'';position:absolute;inset:0 auto 0 0;width:3px;background:var(--blu)}
.metric .value{font-size:30px;font-weight:700;line-height:1.1;letter-spacing:-.6px;
  color:var(--fg);font-variant-numeric:tabular-nums;margin:0 0 4px}
.metric .label{font-size:10.5px;color:var(--dim);text-transform:uppercase;
  letter-spacing:.9px;font-weight:600;margin:0}
.hook-box{background:#11161d;border-left:3px solid var(--org);padding:14px 16px;
  border-radius:0 10px 10px 0;margin-top:14px;color:var(--fg);font-size:13.5px;line-height:1.55}
.error{background:#1c1210;border:1px solid #5a2a24;border-left:3px solid var(--red);
  border-radius:10px;padding:14px 16px;margin-top:16px;color:#d6c9c8;font-size:13px;line-height:1.5}
.loading-text{text-align:center;color:var(--dim);padding:40px 20px;font-size:13.5px}
.example{margin-top:14px;padding:12px;background:var(--bg);border-radius:8px;
  font-size:12.5px;color:var(--dim)}
.example a{color:var(--blu);cursor:pointer;text-decoration:none;transition:color .15s}
.example a:hover{color:var(--fg)}
.stats-row{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap}
.stat-item{flex:1;min-width:110px;background:var(--bg);border:1px solid var(--line);
  border-radius:8px;padding:12px;text-align:center}
.stat-item .stat-value{font-size:20px;font-weight:700;color:var(--grn);font-variant-numeric:tabular-nums}
.stat-item .stat-label{font-size:10.5px;color:var(--dim);text-transform:uppercase;
  letter-spacing:.6px;margin-top:2px}
h2{font-size:15px;font-weight:620;color:var(--fg);margin:0 0 4px}
</style>
</head>
<body>
<div class="container">
  <h1>🎬 Reels Audit</h1>
  <p class="subtitle">Вставь ссылку на Instagram Reel — получи лайки, комменты, просмотры</p>

  <div class="card">
    <input type="url" id="reelUrl" placeholder="https://www.instagram.com/reel/ABC123DEF/" />
    <button class="btn" id="analyzeBtn" onclick="analyze()">Анализировать</button>
    <div class="example">
      💡 Попробуй: <a onclick="document.getElementById('reelUrl').value='https://www.instagram.com/reel/C0xample123/'; analyze()">пример ссылки</a>
    </div>
  </div>

  <div class="result" id="result">
    <div class="card">
      <h2>📊 Результаты анализа</h2>
      <div class="metric-grid">
        <div class="metric">
          <div class="value" id="likes">—</div>
          <div class="label">❤️ Лайки</div>
        </div>
        <div class="metric">
          <div class="value" id="comments">—</div>
          <div class="label">💬 Комменты</div>
        </div>
        <div class="metric">
          <div class="value" id="views">—</div>
          <div class="label">👁 Просмотры</div>
        </div>
      </div>
      <div class="hook-box" id="hookBox" style="display:none;">
        <strong>🎣 Хук:</strong> <span id="hookText"></span>
      </div>
      <div style="margin-top: 20px; color: var(--muted); font-size: 14px;" id="dateText"></div>
    </div>
  </div>

  <div class="loading-text" id="loading" style="display:none;">
    ⏳ Анализирую рилс...
  </div>

  <div class="error" id="error" style="display:none;"></div>
</div>

<script>
// URL Cloudflare Worker
const WORKER_URL = 'https://reels-audit-worker.iralinskiy777.workers.dev';

// Валидация URL
function isValidInstagramUrl(url) {
  if (!url || typeof url !== 'string') return false;
  if (url.length > 2048) return false; // Максимальная длина URL
  try {
    const u = new URL(url);
    return (u.hostname === 'www.instagram.com' || u.hostname === 'instagram.com') 
           && u.pathname.includes('/reel/');
  } catch {
    return false;
  }
}

// Проверка на спецсимволы (XSS защита)
function hasNoSpecialChars(url) {
  return !/[<>\"'&]/.test(url);
}

async function analyze() {
  const url = document.getElementById('reelUrl').value.trim();
  const btn = document.getElementById('analyzeBtn');
  const result = document.getElementById('result');
  const loading = document.getElementById('loading');
  const error = document.getElementById('error');

  if (!url) {
    showError('Вставь ссылку на Instagram Reel');
    return;
  }

  // Валидация URL
  if (!isValidInstagramUrl(url)) {
    showError('Некорректная ссылка. Нужна ссылка на Instagram Reel (https://www.instagram.com/reel/...)');
    return;
  }

  // Проверка на спецсимволы (XSS защита)
  if (!hasNoSpecialChars(url)) {
    showError('URL содержит недопустимые символы');
    return;
  }

  btn.disabled = true;
  btn.classList.add('loading');
  result.classList.remove('show');
  error.style.display = 'none';
  loading.style.display = 'block';

  try {
    // Таймаут 15 секунд
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 15000);

    const resp = await fetch(`${WORKER_URL}?url=${encodeURIComponent(url)}`, {
      signal: controller.signal
    });

    clearTimeout(timeoutId);

    // Проверяем статус ответа
    if (!resp.ok) {
      showError(`Ошибка сервера: ${resp.status} ${resp.statusText}`);
      return;
    }

    const data = await resp.json();

    // Проверяем что ответ не пустой
    if (!data || Object.keys(data).length === 0) {
      showError('Пустой ответ от сервера');
      return;
    }

    if (data.error) {
      showError(data.error);
      return;
    }

    document.getElementById('likes').textContent = data.likes?.toLocaleString('ru') || '—';
    document.getElementById('comments').textContent = data.comments?.toLocaleString('ru') || '—';
    document.getElementById('views').textContent = data.views?.toLocaleString('ru') || '—';
    document.getElementById('dateText').textContent = data.date ? `📅 ${data.date}` : '';

    if (data.hook) {
      document.getElementById('hookBox').style.display = 'block';
      document.getElementById('hookText').textContent = data.hook;
    } else {
      document.getElementById('hookBox').style.display = 'none';
    }

    result.classList.add('show');
  } catch (e) {
    if (e.name === 'AbortError') {
      showError('Таймаут: сервер не ответил за 15 секунд');
    } else {
      showError('Ошибка: ' + e.message);
    }
  } finally {
    btn.disabled = false;
    btn.classList.remove('loading');
    loading.style.display = 'none';
  }
}

function showError(msg) {
  const error = document.getElementById('error');
  error.textContent = '❌ ' + msg;
  error.style.display = 'block';
}

// Enter key
document.getElementById('reelUrl').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') analyze();
});
</script>
</body>
</html>
