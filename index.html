<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reels Audit — Анализ рилсов</title>
<style>
:root {
  --bg: #0d1117;
  --card: #161b22;
  --border: #30363d;
  --text: #c9d1d9;
  --muted: #7d8590;
  --accent: #f0883e;
  --green: #3fb950;
  --red: #f85149;
  --blue: #388bfd;
  --purple: #a371f7;
  --yellow: #d29922;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  line-height: 1.6;
  padding: 24px;
  min-height: 100vh;
}
.container { max-width: 900px; margin: 0 auto; }
h1 { font-size: 32px; margin-bottom: 8px; color: var(--accent); }
.subtitle { color: var(--muted); margin-bottom: 32px; font-size: 16px; }
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 28px;
  margin-bottom: 24px;
  transition: all 0.3s ease;
}
.card:hover {
  border-color: var(--accent);
  box-shadow: 0 0 20px rgba(240,136,62,0.1);
}
input[type="url"] {
  width: 100%;
  padding: 16px 20px;
  background: var(--bg);
  border: 2px solid var(--border);
  border-radius: 12px;
  color: var(--text);
  font-size: 16px;
  margin-bottom: 16px;
  transition: all 0.3s ease;
}
input[type="url"]:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(240,136,62,0.15);
}
.btn {
  background: linear-gradient(135deg, var(--accent), #ff6b35);
  color: #000;
  border: none;
  padding: 16px 32px;
  border-radius: 12px;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s ease;
  width: 100%;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(240,136,62,0.4);
}
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.btn.loading { position: relative; color: transparent; }
.btn.loading::after {
  content: '';
  position: absolute;
  width: 24px;
  height: 24px;
  top: 50%;
  left: 50%;
  margin-left: -12px;
  margin-top: -12px;
  border: 3px solid #000;
  border-top-color: transparent;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.result {
  display: none;
  animation: fadeIn 0.5s ease;
}
.result.show { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.metric-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  margin: 24px 0;
}
.metric {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  text-align: center;
  transition: all 0.3s ease;
}
.metric:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
}
.metric .value {
  font-size: 42px;
  font-weight: 800;
  color: var(--accent);
  margin-bottom: 8px;
  background: linear-gradient(135deg, var(--accent), #ff6b35);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.metric .label {
  font-size: 14px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: 600;
}
.hook-box {
  background: linear-gradient(135deg, rgba(240,136,62,0.1), rgba(240,136,62,0.05));
  border-left: 4px solid var(--accent);
  padding: 20px;
  border-radius: 0 12px 12px 0;
  margin-top: 20px;
  font-style: italic;
  color: var(--text);
  font-size: 16px;
  line-height: 1.8;
}
.error {
  background: rgba(248,81,73,0.1);
  border: 1px solid var(--red);
  color: var(--red);
  padding: 20px;
  border-radius: 12px;
  margin-top: 20px;
  font-weight: 500;
}
.loading-text {
  text-align: center;
  color: var(--muted);
  padding: 60px;
  font-size: 18px;
}
.example {
  margin-top: 20px;
  padding: 16px;
  background: var(--bg);
  border-radius: 8px;
  font-size: 14px;
  color: var(--muted);
}
.example a {
  color: var(--blue);
  cursor: pointer;
  text-decoration: underline;
  transition: color 0.2s;
}
.example a:hover { color: var(--accent); }
.stats-row {
  display: flex;
  gap: 16px;
  margin-top: 20px;
  flex-wrap: wrap;
}
.stat-item {
  flex: 1;
  min-width: 120px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  text-align: center;
}
.stat-item .stat-value {
  font-size: 24px;
  font-weight: 700;
  color: var(--green);
}
.stat-item .stat-label {
  font-size: 12px;
  color: var(--muted);
  margin-top: 4px;
}
</style>
</head>
<body>
<div class="container">
  <h1>🎬 Reels Audit</h1>
  <p class="subtitle">Вставь ссылку на Instagram Reel — получи лайки, комменты, просмотры</p>

  <div class="card">
    <input type="url" id="reelUrl" placeholder="https://www.instagram.com/reel/ABC123DEF/" />
    <button class="btn" id="analyzeBtn" onclick="analyze()">Анализировать</button>
    <div class="example">
      💡 Попробуй: <a onclick="document.getElementById('reelUrl').value='https://www.instagram.com/reel/C0xample123/'; analyze()">пример ссылки</a>
    </div>
  </div>

  <div class="result" id="result">
    <div class="card">
      <h2 style="color: var(--accent); margin-bottom: 20px;">📊 Результаты анализа</h2>
      <div class="metric-grid">
        <div class="metric">
          <div class="value" id="likes">—</div>
          <div class="label">❤️ Лайки</div>
        </div>
        <div class="metric">
          <div class="value" id="comments">—</div>
          <div class="label">💬 Комменты</div>
        </div>
        <div class="metric">
          <div class="value" id="views">—</div>
          <div class="label">👁 Просмотры</div>
        </div>
      </div>
      <div class="hook-box" id="hookBox" style="display:none;">
        <strong>🎣 Хук:</strong> <span id="hookText"></span>
      </div>
      <div style="margin-top: 20px; color: var(--muted); font-size: 14px;" id="dateText"></div>
    </div>
  </div>

  <div class="loading-text" id="loading" style="display:none;">
    ⏳ Анализирую рилс...
  </div>

  <div class="error" id="error" style="display:none;"></div>
</div>

<script>
// URL Cloudflare Worker
const WORKER_URL = 'https://reels-audit-worker.iralinskiy777.workers.dev';

// Валидация URL
function isValidInstagramUrl(url) {
  try {
    const u = new URL(url);
    return (u.hostname === 'www.instagram.com' || u.hostname === 'instagram.com') 
           && u.pathname.includes('/reel/');
  } catch {
    return false;
  }
}

async function analyze() {
  const url = document.getElementById('reelUrl').value.trim();
  const btn = document.getElementById('analyzeBtn');
  const result = document.getElementById('result');
  const loading = document.getElementById('loading');
  const error = document.getElementById('error');

  if (!url) {
    showError('Вставь ссылку на Instagram Reel');
    return;
  }

  // Валидация URL
  if (!isValidInstagramUrl(url)) {
    showError('Некорректная ссылка. Нужна ссылка на Instagram Reel (https://www.instagram.com/reel/...)');
    return;
  }

  btn.disabled = true;
  btn.classList.add('loading');
  result.classList.remove('show');
  error.style.display = 'none';
  loading.style.display = 'block';

  try {
    // Таймаут 15 секунд
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 15000);

    const resp = await fetch(`${WORKER_URL}?url=${encodeURIComponent(url)}`, {
      signal: controller.signal
    });

    clearTimeout(timeoutId);

    // Проверяем статус ответа
    if (!resp.ok) {
      showError(`Ошибка сервера: ${resp.status} ${resp.statusText}`);
      return;
    }

    const data = await resp.json();

    // Проверяем что ответ не пустой
    if (!data || Object.keys(data).length === 0) {
      showError('Пустой ответ от сервера');
      return;
    }

    if (data.error) {
      showError(data.error);
      return;
    }

    document.getElementById('likes').textContent = data.likes?.toLocaleString('ru') || '—';
    document.getElementById('comments').textContent = data.comments?.toLocaleString('ru') || '—';
    document.getElementById('views').textContent = data.views?.toLocaleString('ru') || '—';
    document.getElementById('dateText').textContent = data.date ? `📅 ${data.date}` : '';

    if (data.hook) {
      document.getElementById('hookBox').style.display = 'block';
      document.getElementById('hookText').textContent = data.hook;
    } else {
      document.getElementById('hookBox').style.display = 'none';
    }

    result.classList.add('show');
  } catch (e) {
    if (e.name === 'AbortError') {
      showError('Таймаут: сервер не ответил за 15 секунд');
    } else {
      showError('Ошибка: ' + e.message);
    }
  } finally {
    btn.disabled = false;
    btn.classList.remove('loading');
    loading.style.display = 'none';
  }
}

function showError(msg) {
  const error = document.getElementById('error');
  error.textContent = '❌ ' + msg;
  error.style.display = 'block';
}

// Enter key
document.getElementById('reelUrl').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') analyze();
});
</script>
</body>
</html>
